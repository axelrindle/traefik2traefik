# endpoint for upstream Traefik to scrape configuration
server:
  address: ":1336"

logging:
  # debug, info, warn, error
  level: warn

# downstream Traefik config
traefik:
  # downstream Traefik api endpoint
  endpoint: https://traefik-api.homelab.local

  # I placed basic authentication in my setup
  basicAuth: traefik:traefik

  # skip validation of the endpoint's TLS certificate (self-signed certs)
  insecureSkipVerify: false

  # only include rules which contain the given strings
  ruleFilter:
    - type: rule:contains
      filter: example.org
    - type: rule:regex
      filter: ^Host\(\x60[a-z-]+\.example\.org\x60\) # Host(`foo.example.org`) ...

generator:
  # load-balance to the k3s manager nodes
  targets:
    - https://10.10.10.1
    - https://10.10.10.2

  # Traefik settings
  entrypoints:
    - websecure
  middlewares: []
  passHostHeader: true
