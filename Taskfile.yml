version: '3'

vars:
  INPUT_FILE: cmd/traefik2traefik/main.go
  OUTPUT_DIRECTORY: dist
  OUTPUT_FILE_NAME: traefik2traefik
  OUTPUT_FILE_SUFFIX:
  APP_PACKAGE:
    sh: cat go.mod | head -n1 | cut -d\  -f2
  APP_VERSION:
    sh: git describe --tags --abbrev=0 || echo "0.0.0"
  APP_COMMIT_HASH:
    sh: git rev-parse --short HEAD || echo "abcdef1234567890"
  APP_BUILD_TIMESTAMP:
    sh: date '+%Y-%m-%dT%H:%M:%S'
  IMAGE_NAME: traefik2traefik

tasks:
  default:
    deps:
      - start

  clean:
    cmd: rm -rf "{{.OUTPUT_DIRECTORY}}/"
    silent: true

  build:
    env:
      CGO_ENABLED: "0" # required for full static linking
      GOOS: linux
    vars:
      ABS: "{{.OUTPUT_DIRECTORY}}/{{.OUTPUT_FILE_NAME}}{{.OUTPUT_FILE_SUFFIX}}"
      LDFLAGS: "-X 'main.Version={{.APP_VERSION}}' -X 'main.CommitHash={{.APP_COMMIT_HASH}}' -X 'main.BuildTimestamp={{.APP_BUILD_TIMESTAMP}}'"
    sources:
      - "**/*.go"
    generates:
      - "{{.ABS}}"
    cmds:
      - |
        go build -v \
          -ldflags="-w -s {{.LDFLAGS}}" \
          -o "{{.ABS}}" \
          "{{.INPUT_FILE}}"

  test:
    cmd: go test -v -cover -coverprofile=coverage.out ./...

  start:
    cmd: go run "{{.INPUT_FILE}}"

  docker:
    deps:
      - task: build
    cmds:
      - cmd: docker build . -t "{{.IMAGE_NAME}}"
